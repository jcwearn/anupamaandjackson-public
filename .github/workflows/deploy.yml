name: Deploy

# Deploys to Cloudflare Pages with this repo's own scoped API token, replacing
# Cloudflare's dashboard Git integration.
#
# Triggers on push to ANY branch, which is what the Git integration did: a
# branch pushed without a PR still got a preview.
#
# refresh-schedule-index.yml deploys separately after its nightly commit. It has
# to: a push made with the default GITHUB_TOKEN does not trigger `on: push`, so
# nothing here would ever run for it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    uses: jcwearn/workflows/.github/workflows/cloudflare-pages-deploy.yaml@d88dd60ddaeeb65b628758a975492fb6a4f67b89 # v1
    with:
      # The PROJECT name, not the repo name. See wrangler.jsonc.
      project-name: anupama-and-jackson
      # Four-stage build -- tsc, the client bundle, an SSR bundle, then
      # prerender. ci.yml raises its timeout to 15 for the same reason.
      timeout-minutes: 15
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
