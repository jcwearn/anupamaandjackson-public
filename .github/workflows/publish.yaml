name: Publish Public Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    uses: jcwearn/workflows/.github/workflows/public-sync.yaml@6a75f6e6fde803f32b2ed2987e2142e77abdc4c0 # v1
    with:
      target-repo: jcwearn/anupamaandjackson-public
      readme-override: .github/public-README.md
      # Left at the default passthrough, like the other mirrors. This repo ran
      # on generic for a while, because room assignments were being worked out
      # in commit subjects -- two of them name guests, and .publicignore cannot
      # see a commit message, so message-mode was the only thing guarding it.
      #
      # That work is finished, and those two subjects are historical: a sync
      # only replays messages newer than the last one, so they are out of reach
      # either way. The remaining 546 are dependency bumps and site changes,
      # which are worth reading and were being hidden for nothing.
      #
      # Worth knowing if that changes: the workflow's gitleaks pass scans commit
      # messages, but it catches credentials, not names. Nothing here will stop
      # a subject that names a guest except not writing one.
      signer-name: Jackson Wearn
      signer-email: jcwearn@users.noreply.github.com
    secrets:
      DEPLOY_KEY: ${{ secrets.PUBLIC_SYNC_DEPLOY_KEY }}
      SIGNING_KEY: ${{ secrets.PUBLIC_SYNC_SIGNING_KEY }}
