name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Reads .node-version, which Cloudflare Pages also reads -- so the claim
      # that CI matches the deploy build is now enforced by a shared file
      # rather than asserted in a comment. Pinned exact, so a new 24.x release
      # cannot change what either one runs without a commit saying so.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci

      - run: npm test

      # Also the only typecheck: the build script starts with `tsc -b`.
      - run: npm run build
