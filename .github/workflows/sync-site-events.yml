name: Sync schedule to Wedding HQ

# Pushes data/schedule-events.json to Wedding HQ whenever a merge to main
# changes it. HQ decides which events each guest sees from its own copy of this
# catalog (the guest lookup reads it on every request), and that copy used to be
# refreshed only by someone remembering to run `npm run import:site-events` in
# wedding-hq after the merge. That step got forgotten, and when it does,
# guests see the old schedule with nothing to say so.
#
# Main only, never a branch push. HQ has one catalog -- production's -- and a
# preview branch replacing it would put unreviewed times in front of every
# guest.
#
# It does not wait for the Pages deploy. HQ never sends the copy of the
# universal events (the ceremony and lunch, bundled into the site so the page
# prerenders); it sends only their ids. So what HQ serves and what the bundle
# shows never have to change in the same instant, and the deploy and this sync
# can finish in either order.
#
# The token is the site's own events-sync token (cloudflare-infra's
# anupamaandjackson_events_sync_service_token), not the lookup token in the
# Pages secrets. HQ confines it to PUT /api/site/events -- it cannot read the
# guest list, or even read the catalog back -- so the worst a leak of these two
# secrets can do is overwrite the schedule's copy.
#
# The manual equivalent, for a re-sync, is still:
#   (in wedding-hq) npm run import:site-events -- ../anupamaandjackson/data/schedule-events.json

on:
  push:
    branches: [main]
    paths: [data/schedule-events.json]
  workflow_dispatch:

permissions:
  contents: read

# Two merges in quick succession must not race and land the older file last.
# Not cancel-in-progress: a PUT cut off halfway is no better, and GitHub keeps
# only the newest queued run, which is the one that should win.
concurrency:
  group: sync-site-events

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The file wraps the list in { _comment, events }; HQ stores the list.
      #
      # Redirects are NOT followed, and anything but a 200 fails the run. Access
      # answers a rejected token with a 302 to its login page, which curl
      # --fail would count as success. Only HQ's own reply ({"events":N}) is
      # printed -- never the payload, which carries the gated events' copy.
      - name: Replace HQ's event catalog
        env:
          CLIENT_ID: ${{ secrets.HQ_EVENTS_SYNC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.HQ_EVENTS_SYNC_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::HQ_EVENTS_SYNC_CLIENT_ID / HQ_EVENTS_SYNC_CLIENT_SECRET are not set. See the header of this workflow."
            exit 1
          fi
          status=$(jq -c '.events' data/schedule-events.json \
            | curl -sS -o "$RUNNER_TEMP/response" -w '%{http_code}' \
                -X PUT https://hq.anupamaandjackson.com/api/site/events \
                -H "CF-Access-Client-Id: $CLIENT_ID" \
                -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
                -H 'Content-Type: application/json' \
                --data-binary @-)
          if [ "$status" != 200 ]; then
            echo "::error::Wedding HQ answered HTTP $status"
            head -c 500 "$RUNNER_TEMP/response"
            exit 1
          fi
          cat "$RUNNER_TEMP/response"
